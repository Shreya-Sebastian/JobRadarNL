# The production release. Flux renders deploy/helm/radar with the production values and upgrades the release
# whenever this file, the chart or the values change on the `deploy` branch. .github/workflows/deploy.yml sets
# image.tag there after the tests pass and the image is built (on main the tag below is not updated); a release
# whose pods never get ready is rolled back to the last good one.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
  namespace: flux-system
spec:
  interval: 10m
  releaseName: radar
  targetNamespace: radar
  storageNamespace: radar
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm/radar
      sourceRef:
        kind: GitRepository
        name: flux-system
      reconcileStrategy: Revision  # chart template changes deploy too, not only version bumps
      valuesFiles:
        - deploy/helm/radar/values.yaml
        - deploy/aws/values-prod.yaml
  install:
    remediation:
      retries: 1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 1
      strategy: rollback
  values:
    image:
      tag: sha-7acf30f15ddb  # set by .github/workflows/deploy.yml
