#cloud-config
package_update: true
packages: [postgresql, postgresql-contrib, ufw]
write_files:
  - path: /root/setup-postgres.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      set -e
      sudo -u postgres psql -c "CREATE USER radar WITH PASSWORD '${postgres_password}';" || true
      sudo -u postgres psql -c "CREATE DATABASE radar OWNER radar;" || true
      PGCONF=$(ls /etc/postgresql/*/main/postgresql.conf)
      PGHBA=$(ls /etc/postgresql/*/main/pg_hba.conf)
      # Listen on all interfaces so pods can reach it; ufw keeps port 5432 closed to the internet.
      sed -i "s/^#listen_addresses.*/listen_addresses = '*'/" "$PGCONF"
      PUBLIC_IP=$(curl -s ifconfig.me)
      {
        echo "host radar radar 10.42.0.0/16 scram-sha-256"   # k3s pod network
        echo "host radar radar 10.43.0.0/16 scram-sha-256"   # k3s service network
        echo "host radar radar $PUBLIC_IP/32 scram-sha-256"  # pods reaching the node's own address
      } >> "$PGHBA"
      systemctl restart postgresql
  - path: /etc/cron.daily/radar-pgdump
    permissions: "0755"
    content: |
      #!/bin/bash
      mkdir -p /var/backups/radar
      sudo -u postgres pg_dump radar | gzip > /var/backups/radar/radar-$(date +%F).sql.gz
      find /var/backups/radar -mtime +14 -delete
runcmd:
  - /root/setup-postgres.sh
  # Firewall: public ports plus unrestricted traffic from the cluster's own networks
  - ufw allow 22 && ufw allow 80 && ufw allow 443 && ufw allow 6443
  - ufw allow from 10.42.0.0/16 && ufw allow from 10.43.0.0/16
  - ufw --force enable
  # k3s single node: keeps Traefik (ingress) and the built-in service load balancer that binds ports 80/443
  - curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --tls-san $(curl -s ifconfig.me)" sh -
  - sleep 30
  # cert-manager for Let's Encrypt certificates
  - /usr/local/bin/kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.3/cert-manager.yaml
  # Optional: KEDA for queue-depth autoscaling of workers
  # - /usr/local/bin/kubectl apply --server-side -f https://github.com/kedacore/keda/releases/download/v2.15.1/keda-2.15.1.yaml
