<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="60">
<title>Tech Jobs Radar is being updated</title>
<style>
  :root { --bg: #f8fafc; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --accent: #047857; --on-accent: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #020617; --card: #0f172a; --ink: #f1f5f9; --muted: #94a3b8; --line: #1e293b; --accent: #34d399; --on-accent: #022c22; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif; }
  main { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; margin-bottom: 24px; }
  .logo { width: 32px; height: 32px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0; color: var(--muted); }
  .nl { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
  .wait { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; font-size: 14px; color: var(--muted); }
  .spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><g fill="none" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round"><circle cx="16" cy="16" r="10" opacity=".35"/><circle cx="16" cy="16" r="5.5" opacity=".6"/><path d="M16 16l7-7"/></g><circle cx="16" cy="16" r="1.8" fill="var(--on-accent)"/><circle cx="10.5" cy="20" r="1.8" fill="var(--on-accent)"/></svg>
    Tech Jobs Radar
  </div>
  <h1>Being updated</h1>
  <p>The site is back in about a minute. This page reloads by itself.</p>
  <div class="nl" lang="nl">
    <h1>Wordt bijgewerkt</h1>
    <p>De site is over ongeveer een minuut terug. Deze pagina laadt vanzelf opnieuw.</p>
  </div>
  <div class="wait" role="status"><span class="spin" aria-hidden="true"></span><span>Checking / Bezig met controleren</span></div>
</main>
<script>
  // reload as soon as the site answers again
  (function check() {
    fetch("/healthz", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && d.ok) location.reload(); else setTimeout(check, 4000); })
      .catch(function () { setTimeout(check, 4000); });
  })();
</script>
</body>
</html>
