apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "radar.fullname" . }}-worker
  labels: {{- include "radar.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.keda.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "radar.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "radar.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.worker.metricsPort | quote }}
        prometheus.io/path: /metrics
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 120   # let an in-flight board fetch finish
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "radar.cli", "worker", "--metrics-port", {{ .Values.worker.metricsPort | quote }}]
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort }}
          env: {{- include "radar.env" . | nindent 12 }}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 30
            failureThreshold: 3
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
{{- if .Values.worker.keda.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "radar.fullname" . }}-worker
  labels: {{- include "radar.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "radar.fullname" . }}-worker
  minReplicaCount: {{ .Values.worker.keda.minReplicas }}
  maxReplicaCount: {{ .Values.worker.keda.maxReplicas }}
  cooldownPeriod: {{ .Values.worker.keda.cooldownPeriod }}
  triggers:
    - type: redis
      metadata:
        address: {{ include "radar.fullname" . }}-redis:6379
        listName: rq:queue:crawl
        listLength: {{ .Values.worker.keda.listLength | quote }}
{{- end }}
