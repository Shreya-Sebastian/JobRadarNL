{{- if not .Values.worker.timetable }}
{{- $root := . -}}
{{- range $job := list (dict "name" "scheduler" "cmd" "schedule" "schedule" .Values.scheduler.schedule) (dict "name" "finalizer" "cmd" "finalize" "schedule" .Values.finalizer.schedule) (dict "name" "linkcheck" "cmd" "linkcheck" "schedule" .Values.linkcheck.schedule) (dict "name" "qualitycheck" "cmd" "check" "schedule" .Values.qualitycheck.schedule) (dict "name" "analytics" "cmd" "analytics-nightly" "schedule" .Values.analytics.schedule) (dict "name" "alerts" "cmd" "send-alerts" "schedule" .Values.alerts.schedule) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "radar.fullname" $root }}-{{ $job.name }}
  labels: {{- include "radar.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $job.name }}
spec:
  schedule: {{ $job.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1500
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "radar.name" $root }}
            app.kubernetes.io/instance: {{ $root.Release.Name }}
            app.kubernetes.io/component: {{ $job.name }}
        spec:
          restartPolicy: Never
          {{- with $root.Values.image.pullSecrets }}
          imagePullSecrets: {{- range . }}
            - name: {{ . }}
          {{- end }}
          {{- end }}
          securityContext: {{- toYaml $root.Values.podSecurityContext | nindent 12 }}
          containers:
            - name: {{ $job.name }}
              image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
              imagePullPolicy: {{ $root.Values.image.pullPolicy }}
              command: ["python", "-m", "radar.cli", {{ $job.cmd | quote }}]
              env: {{- include "radar.env" $root | nindent 16 }}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
{{- end }}
{{- end }}
