name: deploy

# Continuous delivery, GitOps style. Every push to main: the full test suite and evaluation gates (ci.yml), then an
# image tagged with the commit, then the `deploy` branch is set to that exact commit plus one commit that points
# deploy/flux/radar.yaml at the image. Flux, running in the cluster, follows the `deploy` branch and upgrades the
# Helm release (rolling back if the new pods never get ready). The last job waits until the live site reports the
# new build. Nothing here can reach the cluster, and main only ever holds people's own commits.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false  # never stop a deploy halfway; the next push waits its turn

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the deploy branch that tells Flux what to run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}  # exactly the commit that passed the tests
      - name: Point the deploy branch at this commit and its image
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          sed -i -E "s/^( +tag: )sha-[0-9a-f]{12}/\1${TAG}/" deploy/flux/radar.yaml
          grep -q "tag: ${TAG}" deploy/flux/radar.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${TAG}" || true
          # the deploy branch is main's tested commit plus this one; deploys run one at a time (concurrency above),
          # and a push with this token starts no new workflow run
          git push --force origin HEAD:refs/heads/deploy

  verify:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Live site runs the new build
        run: |
          want="${GITHUB_SHA::12}"
          for _ in $(seq 1 60); do
            got="$(curl -fsS -A "TechJobsRadar-deploy-check" https://techjobsradar.nl/healthz | jq -r '.build // empty' || true)"
            [ "$got" = "$want" ] && { echo "live: $got"; exit 0; }
            echo "live: ${got:-?}, waiting for $want"
            sleep 20
          done
          echo "the site did not switch to $want within 20 minutes (Flux rolls back a release that fails)"
          exit 1
