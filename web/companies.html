<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employers hiring for tech in the Netherlands | {{SITE_NAME}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{SITE_URL}}/companies">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css?v=3">
<script type="application/ld+json">{{JSONLD}}</script>
</head>

</header>
<main class="wrap pt-1">
  <p class="tag mt-4 mb-0">{{SITE_TAGLINE}}</p>
  <div class="card">
    <h2>{{COUNT}} employers with open tech roles</h2>
    <ul class="cols">{{ITEMS}}</ul>

<footer class="site-footer"><div class="wrap py-8"><p><b class="text-ink">{{SITE_NAME}}</b> lists tech vacancies in the Netherlands read directly from employers' career sites.</p></div></footer>
